<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif">
<rect width="720" height="300" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="24" y="28" font-size="16" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">プログラムの構成（車の中の3つのコンピュータをパソコン上で再現）</text>
<rect x="30" y="80" width="230" height="130" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="145" y="106" font-size="15" font-weight="bold" fill="#712B13" text-anchor="middle" dominant-baseline="central">エンジンの見張り役</text>
<text x="145" y="136" font-size="13" fill="#993C1D" text-anchor="middle" dominant-baseline="central">温度などを1秒ごとに確認</text>
<text x="145" y="160" font-size="13" fill="#993C1D" text-anchor="middle" dominant-baseline="central">異常を見つけて記録</text>
<text x="145" y="184" font-size="13" fill="#993C1D" text-anchor="middle" dominant-baseline="central">異常があっても安全に動き続ける</text>
<rect x="460" y="60" width="230" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="575" y="83" font-size="15" font-weight="bold" fill="#085041" text-anchor="middle" dominant-baseline="central">冷却ファン係</text>
<text x="575" y="109" font-size="13" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">熱ければファンを回す</text>
<rect x="460" y="170" width="230" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="575" y="193" font-size="15" font-weight="bold" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">メーター</text>
<text x="575" y="219" font-size="13" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">運転席に表示する</text>
<path d="M260 110 L360 110 L360 95 L456 95" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="78" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">温度・異常を知らせる</text>
<path d="M260 180 L360 180 L360 205 L456 205" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="224" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">表示する値を知らせる</text>
<line x1="575" y1="130" x2="575" y2="166" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="587" y="149" font-size="12" fill="#5F5E5A" dominant-baseline="central">ファンの状態</text>
<text x="360" y="270" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">3つのコンピュータは、車の中の通信線（CAN）でやり取りする</text>
</svg>
