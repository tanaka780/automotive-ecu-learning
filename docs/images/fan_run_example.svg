<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP',sans-serif">
<rect width="720" height="400" fill="#FFFFFF"/>
<text x="24.0" y="28.0" font-size="16" fill="#2C2C2A" text-anchor="start" font-weight="bold" dominant-baseline="central">実際に動かした結果（温度センサーに異常が起きた場合）</text>
<rect x="354.0" y="118" width="168.0" height="140" fill="#FAECE7"/>
<text x="438.0" y="244.0" font-size="12" fill="#D85A30" text-anchor="middle" font-weight="normal" dominant-baseline="central">センサー異常と判断中</text>
<line x1="130" y1="180.2" x2="690" y2="180.2" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="24.0" y="126.0" font-size="13" fill="#5F5E5A" text-anchor="start" font-weight="normal" dominant-baseline="central">温度</text>
<polyline points="130.0,235.8 158.0,235.8 158.0,235.8 186.0,235.8 186.0,235.8 214.0,235.8 214.0,169.1 242.0,169.1 242.0,169.1 270.0,169.1 270.0,169.1 298.0,169.1 298.0,129.1 326.0,129.1 326.0,129.1 354.0,129.1 354.0,129.1 382.0,129.1 382.0,129.1 410.0,129.1 410.0,129.1 438.0,129.1 438.0,129.1 466.0,129.1 466.0,189.1 494.0,189.1 494.0,189.1 522.0,189.1 522.0,189.1 550.0,189.1 550.0,213.6 578.0,213.6 578.0,213.6 606.0,213.6 606.0,213.6 634.0,213.6 634.0,213.6 662.0,213.6 662.0,213.6 690.0,213.6" fill="none" stroke="#D85A30" stroke-width="3" stroke-linejoin="round"/>
<text x="122.0" y="235.8" font-size="12" fill="#D85A30" text-anchor="end" font-weight="normal" dominant-baseline="central">70℃</text>
<text x="122.0" y="169.1" font-size="12" fill="#D85A30" text-anchor="end" font-weight="normal" dominant-baseline="central">100℃</text>
<text x="122.0" y="129.1" font-size="12" fill="#D85A30" text-anchor="end" font-weight="normal" dominant-baseline="central">118℃</text>
<text x="122.0" y="189.1" font-size="12" fill="#D85A30" text-anchor="end" font-weight="normal" dominant-baseline="central">91℃</text>
<text x="122.0" y="213.6" font-size="12" fill="#D85A30" text-anchor="end" font-weight="normal" dominant-baseline="central">80℃</text>
<text x="24.0" y="293.0" font-size="13" fill="#5F5E5A" text-anchor="start" font-weight="normal" dominant-baseline="central">冷却ファン</text>
<rect x="130" y="278" width="560" height="30" rx="4" fill="none" stroke="#B4B2A9" stroke-width="1"/>
<text x="172.0" y="293.0" font-size="13" fill="#5F5E5A" text-anchor="middle" font-weight="normal" dominant-baseline="central">止まっている</text>
<rect x="214.0" y="278" width="336.0" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="382.0" y="293.0" font-size="13" fill="#085041" text-anchor="middle" font-weight="normal" dominant-baseline="central">回っている</text>
<text x="620.0" y="293.0" font-size="13" fill="#5F5E5A" text-anchor="middle" font-weight="normal" dominant-baseline="central">止まっている</text>
<line x1="228.0" y1="72.0" x2="228.0" y2="308.0" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="2 3"/>
<circle cx="228.0" cy="64.0" r="3" fill="#2C2C2A"/>
<text x="234.0" y="64.0" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="normal" dominant-baseline="central">熱い → ファンON</text>
<line x1="368.0" y1="72.0" x2="368.0" y2="308.0" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="2 3"/>
<circle cx="368.0" cy="64.0" r="3" fill="#2C2C2A"/>
<text x="374.0" y="64.0" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="normal" dominant-baseline="central">危険な値が続く → センサー異常と判断</text>
<line x1="536.0" y1="94.0" x2="536.0" y2="308.0" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="2 3"/>
<circle cx="536.0" cy="86.0" r="3" fill="#2C2C2A"/>
<text x="542.0" y="86.0" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="normal" dominant-baseline="central">センサー回復</text>
<line x1="564.0" y1="116.0" x2="564.0" y2="308.0" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="2 3"/>
<circle cx="564.0" cy="108.0" r="3" fill="#2C2C2A"/>
<text x="570.0" y="108.0" font-size="12" fill="#2C2C2A" text-anchor="start" font-weight="normal" dominant-baseline="central">冷えた → ファン停止</text>
<line x1="130" y1="330" x2="690" y2="330" stroke="#B4B2A9" stroke-width="1"/>
<text x="144.0" y="344.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal" dominant-baseline="central">1</text>
<text x="256.0" y="344.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal" dominant-baseline="central">5</text>
<text x="396.0" y="344.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal" dominant-baseline="central">10</text>
<text x="536.0" y="344.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal" dominant-baseline="central">15</text>
<text x="676.0" y="344.0" font-size="12" fill="#5F5E5A" text-anchor="middle" font-weight="normal" dominant-baseline="central">20</text>
<text x="690.0" y="364.0" font-size="12" fill="#5F5E5A" text-anchor="end" font-weight="normal" dominant-baseline="central">経過時間（秒）</text>
<line x1="24" y1="364" x2="48" y2="364" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="54.0" y="364.0" font-size="12" fill="#5F5E5A" text-anchor="start" font-weight="normal" dominant-baseline="central">ファンを回し始める温度（95℃）</text>
<text x="24.0" y="386.0" font-size="11" fill="#5F5E5A" text-anchor="start" font-weight="normal" dominant-baseline="central">※ 車のコンピュータをパソコン上で再現したプログラムの出力から作図（温度は試験用に設定した値）</text>
</svg>
